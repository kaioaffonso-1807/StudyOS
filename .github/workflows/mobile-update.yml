name: StudyOS Mobile Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: true
        default: Production update

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-ai/apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Publish production update
        run: npx eas-cli update --channel production --message "${{ inputs.message }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
