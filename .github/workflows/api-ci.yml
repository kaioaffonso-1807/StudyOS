name: StudyOS API CI

on:
  push:
    branches: [main]
    paths:
      - "english-ai/apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "english-ai/apps/api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-ai/apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: english-ai/apps/api/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
