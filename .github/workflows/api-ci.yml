name: StudyOS API CI

on:
  push:
    branches: [main]
    paths:
      - "english-ai/apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "english-ai/apps/api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-ai/apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
